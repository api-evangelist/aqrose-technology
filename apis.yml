name: Aqrose Technology
description: 'Aqrose Technology (阿丘科技) is an industrial AI machine-vision platform
  provider founded in Beijing in 2017 out of the Tsinghua University AI Lab, now dual-headquartered
  in Beijing and Singapore with offices in Suzhou, Shenzhen, Hsinchu, Berlin, Tokyo,
  and Seoul. The company builds AI tools, models, and turnkey systems for manufacturing
  quality control, safety inspection, and process optimization, with 20,000+ AI deployments
  across 1,200+ clients in 50+ industrial sectors. Its product line spans the AIDI
  defect-inspection platform, the AQVision low-code AI vision development toolkit,
  the AIDG toolkit, the SV2000 smart vision hardware, an AI Review System (ARS), a
  robot inspection system, and the AQ-VLM industrial vision-language model, serving
  EV batteries, automotive, semiconductors, pharmaceuticals, electronics, photovoltaics,
  food and beverage, and packaging. Surfaced as a portfolio company of dcm-ventures
  and profiled in the API Evangelist network; no public developer API surface was
  found at the time of enrichment.'
